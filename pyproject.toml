[project]
name = "stockboys"
version = "0.1.0"
description = "Multiplayer board game backend"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.140.9,<0.141.0)",
    "uvicorn[standard] (>=0.51.0,<0.52.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "websockets (<14)",
    "redis (>=8.1.0,<9.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"